name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real, throwaway Postgres container just for this CI run -
    # GitHub Actions starts it before any step runs and tears it
    # down after, same idea as our local docker-compose postgres
    # service but scoped to just this one job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studytime
          POSTGRES_PASSWORD: studytime
          POSTGRES_DB: studytime
        ports:
          - 5432:5432
        # Waits for Postgres to actually accept connections before
        # letting any step run - without this, the first step could
        # try to connect before the container has finished starting.
        options: >-
          --health-cmd "pg_isready -U studytime -d studytime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    # localhost works here because GitHub Actions maps the service
    # container's port 5432 onto the job runner's own localhost.
    # SECRET_KEY just needs to be A value - it only has to be
    # consistent within this one CI run, not the real production secret.
    env:
      DATABASE_URL: postgresql://studytime:studytime@localhost:5432/studytime
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      # No Redis service running in this job, and none needed - eager
      # mode makes .delay() run the Celery task synchronously in the
      # same process instead of handing it to a broker/worker.
      CELERY_TASK_ALWAYS_EAGER: "true"
      # generation.py reads GEMINI_API_KEY the moment it's imported,
      # even in test_generation.py's fully-mocked tests that never
      # actually call Gemini - so a fake value is enough to satisfy
      # that import, same reasoning as the fake-but-valid DATABASE_URL
      # this job used before a real Postgres service was added.
      GEMINI_API_KEY: ci-fake-key-tests-are-fully-mocked
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      # Creates the actual tables (users, documents, etc.) in the
      # fresh CI postgres container - without this, test_auth.py's
      # queries would fail with "relation users does not exist"
      # even though the database connection itself works fine.
      - name: Run migrations
        run: alembic upgrade head

      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build